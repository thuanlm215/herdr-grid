name: Bug report
description: Report a reproducible problem with herdr-grid
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve herdr-grid. Remove private pane output before submitting.
  - type: input
    id: version
    attributes:
      label: herdr-grid version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: herdr
    attributes:
      label: Herdr version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and terminal
      placeholder: Ubuntu 24.04, WezTerm 2026.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest pane layout that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private pane output, and sensitive paths.
          required: true
