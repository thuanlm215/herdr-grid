id = "herdr-grid"
name = "herdr-grid"
version = "0.4.0"
description = "Visual pane layout editor with drag-and-drop, new shells, and reusable layouts"
min_herdr_version = "0.8.2"
platforms = ["linux", "macos"]

[[build]]
platforms = ["linux", "macos"]
command = ["/bin/sh", "scripts/fetch-or-build.sh"]

[[panes]]
id = "grid"
title = "Layout grid"
placement = "popup"
command = ["bash", "scripts/run-pane.sh"]

[[actions]]
id = "open"
title = "Open layout editor"
description = "Open the active tab layout editor in a popup."
command = ["./target/release/herdr-grid", "--open-popup"]
